name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Run tests
        working-directory: cli
        run: go test ./...
      - name: GoReleaser release
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2.18"
          args: release --clean
          workdir: cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest build provenance
        # Opportunistic: mise's github backend verifies this when present and
        # simply skips the check when it's not, so it must never fail the
        # release itself. GitHub also doesn't support attestations on
        # user-owned private repos at all (only public, or org-owned) — this
        # step is a real no-op until the repo goes public, by design.
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            cli/dist/*.tar.gz
            cli/dist/*checksums.txt
