# Grafana datasources, provisioned as code. The VictoriaMetrics datasource
# plugins are installed at container start via GF_INSTALL_PLUGINS.
apiVersion: 1
datasources:
  - name: VictoriaMetrics
    type: victoriametrics-metrics-datasource
    uid: victoriametrics
    access: proxy
    url: http://10.89.0.10:8428
    isDefault: true
    jsonData:
      httpMethod: POST
  - name: VictoriaLogs
    type: victoriametrics-logs-datasource
    uid: victorialogs
    access: proxy
    url: http://10.89.0.11:9428
  - name: Alertmanager
    type: alertmanager
    uid: alertmanager
    access: proxy
    url: http://10.89.0.14:9093
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: false
