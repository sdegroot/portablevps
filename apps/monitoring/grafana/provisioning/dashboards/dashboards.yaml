# Load every dashboard JSON dropped into /etc/grafana/dashboards.
apiVersion: 1
providers:
  - name: portablevps
    orgId: 1
    folder: ""
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
