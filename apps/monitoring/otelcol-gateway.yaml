# OpenTelemetry Collector — fleet OTLP gateway + this host's own agent.
# Ported from epistola-vps-infra/servers/monitoring/roles/otelcol (de-templated
# for NixOS: static ports, filelog reads /var/log/syslog populated by rsyslog).
#
#   receivers: otlp (fleet ships here over the mesh), hostmetrics, docker_stats, filelog
#   exporters: metrics -> VictoriaMetrics, logs -> VictoriaLogs (both on loopback)
#
# The collector runs Network=host, so it reaches VictoriaMetrics/VictoriaLogs on
# 127.0.0.1 and binds the OTLP ports on all interfaces (the host firewall opens
# them on the NetBird interface only).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  hostmetrics:
    collection_interval: 30s
    root_path: /host
    scrapers:
      cpu:
      memory:
      disk:
      filesystem:
      load:
      network:
      processes:

  docker_stats:
    endpoint: unix:///var/run/docker.sock
    collection_interval: 30s
    metrics:
      container.cpu.usage.percpu:
        enabled: true
      container.network.io.usage.tx_dropped:
        enabled: true
      container.network.io.usage.rx_dropped:
        enabled: true

  filelog:
    include:
      - /var/log/syslog
    start_at: end

processors:
  # VictoriaMetrics wants cumulative temporality; fleet hostmetrics/docker_stats
  # can arrive as delta. Convert up front so every series is cumulative.
  deltatocumulative: {}
  batch:
    timeout: 10s
    send_batch_size: 1024
  # override:false so detectors enrich this host's OWN telemetry but never
  # clobber the host.name/namespace the fleet's collectors already stamped.
  resourcedetection:
    detectors: [system, env]
    system:
      hostname_sources: [os]
    override: false
  resource:
    attributes:
      - key: host.id
        from_attribute: host.name
        action: upsert

exporters:
  otlphttp/victoriametrics:
    metrics_endpoint: http://127.0.0.1:8428/opentelemetry/v1/metrics
    encoding: proto
    compression: gzip
  otlphttp/victorialogs:
    logs_endpoint: http://127.0.0.1:9428/insert/opentelemetry/v1/logs

service:
  telemetry:
    logs:
      level: info
  pipelines:
    metrics:
      receivers: [otlp, hostmetrics, docker_stats]
      processors: [deltatocumulative, batch, resourcedetection, resource]
      exporters: [otlphttp/victoriametrics]
    logs:
      receivers: [otlp, filelog]
      processors: [batch, resourcedetection, resource]
      exporters: [otlphttp/victorialogs]
