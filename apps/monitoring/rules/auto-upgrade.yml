# Self-upgrade freshness alert. Fed by
# portablevps_autoupgrade_last_success_timestamp_seconds, which a box running
# system.autoUpgrade (portablevps.autoUpgrade) pushes to the OTLP gateway after a
# successful nixos-upgrade run (see modules/system/telemetry.nix). The metric
# carries a host_name label, so this fires one alert per stale host.
#
# This catches "was succeeding, now failing" (fetch/auth or build failures never
# switch, so the box silently stops updating). It can NOT catch a box that has
# never succeeded since enablement (no series to age) — acceptable while opt-in is
# a small, watched set; add per-host presence rules if that changes.
groups:
  - name: auto-upgrade-freshness
    interval: 1m
    rules:
      - alert: AutoUpgradeStale
        expr: time() - portablevps_autoupgrade_last_success_timestamp_seconds > 3 * 3600
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Self-upgrade falling behind on {{ $labels.host_name }}"
          description: >-
            No successful system.autoUpgrade on {{ $labels.host_name }} for {{ $value | humanizeDuration }}
            (schedule is every 30 min). Likely a fetch/auth or build failure — the box is stuck on its
            last generation. Check nixos-upgrade.service / journalctl -u nixos-upgrade on the host.
